# Thermo dial: a tile for a climate entity with - and + keys; a tap opens a card with a draggable dial, like Home Assistant's thermostat card.
# Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: thermo_dial
version: 0.2.1
api: "0.12"
icon: thermometer
maintainer: alexcoscia
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 6

permissions:
  # climate.set_temperature is the dial's and the - and + keys' command; climate.set_hvac_mode the mode key's.
  home_assistant_actions: [climate.set_temperature, climate.set_hvac_mode]

cards:
  - { id: dial, name: card_name }

tiles:
  - id: dial
    name: tile_name
    icon: thermometer
    # From 1x1: the editor starts a tile at one cell and grows it one axis at a time, so a larger minimum has no handles.
    sizes: { min: 1x1, max: 4x4 }
    memory: 3000
    domains: [climate]
    attributes: [temperature, current_temperature, min_temp, max_temp, target_temp_step, hvac_action, hvac_modes]
    example: tile_example
    preview: { title: "{name}", value: "{temperature}" }
