# Thermo dial: a tile with a draggable dial for a climate entity, like Home Assistant's thermostat card.
id: thermo_dial
version: 0.0.1
api: "0.10"
icon: thermometer
maintainer: alexcoscia
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 6

tiles:
  - id: dial
    name: tile_name
    icon: thermometer
    sizes: { min: 2x2, max: 4x4 }
    memory: 3000
    domains: [climate]
    attributes: [temperature]
    example: tile_example
